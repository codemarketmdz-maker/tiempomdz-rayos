name: lluvia-goes19
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
concurrency:
  group: lluvia
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  lluvia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: pub
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install netCDF4 numpy
      - run: python goes_lluvia_json.py pub/lluvia.json
      - name: Publicar
        working-directory: pub
        run: |
          git config user.name "lluvia-bot"
          git config user.email "lluvia-bot@users.noreply.github.com"
          git add lluvia.json
          git diff --cached --quiet || (git commit -m "lluvia GOES-19" && git pull --rebase -q && git push)
