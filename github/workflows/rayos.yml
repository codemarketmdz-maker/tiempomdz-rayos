name: rayos
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rayos
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install netCDF4 numpy
      - run: python glm_a_json.py out/rayos.json
      - name: Publicar rayos.json (una sola versión en la rama data)
        run: |
          cd out
          git init -q -b data
          git config user.name rayos-bot
          git config user.email rayos-bot@users.noreply.github.com
          git add rayos.json
          git commit -qm "rayos $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data

